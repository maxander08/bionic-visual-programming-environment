name: Deploy to GitHub Pages

# Builds the single-file bundle and publishes it to GitHub Pages.
# Runs on every push to main, and can be triggered by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue them instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build single-file bundle
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
